# Database configuration (Placeholders, do not start DB connection yet)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/placementhub_dev}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Note: In Phase 1, we don't strictly need MySQL running just to test the health endpoint,
# but we configure it as a placeholder. If MySQL is not running, Spring Boot might fail to start
# because of JPA auto-configuration.
# To allow it to start without a database during Phase 1 testing, we can disable the datasource auto-configuration
# or defer initialization. Let's keep it standard. If DB is unavailable, it will throw an error on startup.
